<script>
const API_URL='https://vexa-ai-companion-production.up.railway.app/api/chat';const stage=document.getElementById('stage'),statusEl=document.getElementById('status'),statusText=document.getElementById('statusText'),mic=document.getElementById('mic'),chatBtn=document.getElementById('chatBtn'),voiceBtn=document.getElementById('voiceBtn'),drawer=document.getElementById('drawer'),closeDrawer=document.getElementById('closeDrawer'),messages=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send'),clock=document.getElementById('clock');const history=[];let busy=false,voiceMode=false,isSpeaking=false,rec=null,hideTimer=null;function setStatus(s){statusEl.className='status '+s.toLowerCase();statusText.textContent=s}function showControls(){stage.classList.add('show-controls');clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(!drawer.classList.contains('open'))stage.classList.remove('show-controls')},4500)}stage.addEventListener('pointerdown',e=>{if(!drawer.contains(e.target))showControls()});function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d}function cleanSpeech(t){return t.replace(/[*#_`>]/g,'').replace(/https?:\/\/\S+/g,'').replace(/\s+/g,' ').trim()}function pickVoice(){const v=speechSynthesis.getVoices();return v.find(x=>/id-ID/i.test(x.lang))||v.find(x=>/ja-JP/i.test(x.lang))||null}function speak(text){return new Promise(resolve=>{if(!('speechSynthesis' in window)){resolve();return}speechSynthesis.cancel();isSpeaking=true;setStatus('SPEAKING');const u=new SpeechSynthesisUtterance(cleanSpeech(text));u.lang='id-ID';u.rate=.98;u.pitch=1.04;const v=pickVoice();if(v)u.voice=v;u.onend=u.onerror=()=>{isSpeaking=false;resolve()};speechSynthesis.speak(u)})}async function ask(text){if(!text||busy)return;busy=true;setStatus('THINKING');const t=drawer.classList.contains('open')?add('Vexa sedang berpikir…','bot'):null;try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history.slice(-12)})});const data=await r.json().catch(()=>({}));if(t)t.remove();if(!r.ok||!data.ok)throw new Error();if(drawer.classList.contains('open'))add(data.reply,'bot');history.push({role:'user',content:text},{role:'assistant',content:data.reply});if(history.length>24)history.splice(0,history.length-24);await speak(data.reply)}catch(e){if(t)t.remove();if(drawer.classList.contains('open'))add('Maaf, Bang John. Vexa belum bisa terhubung ke AI.','bot');setStatus('ONLINE')}finally{busy=false;if(voiceMode)startListening();else if(!isSpeaking)setStatus('ONLINE')}}function submit(){const x=input.value.trim();if(!x)return;add(x,'user');input.value='';ask(x)}send.onclick=submit;input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});chatBtn.onclick=e=>{e.stopPropagation();drawer.classList.add('open');stage.classList.add('show-controls');input.focus()};closeDrawer.onclick=()=>{drawer.classList.remove('open');showControls()};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){rec=new SR();rec.lang='id-ID';rec.interimResults=false;rec.continuous=false;rec.onstart=()=>setStatus('LISTENING');rec.onresult=e=>{const x=e.results[e.results.length-1][0].transcript.trim();if(!x)return;if(drawer.classList.contains('open'))add(x,'user');stopListening();ask(x)};rec.onerror=e=>{if(e.error==='not-allowed'){voiceMode=false;setStatus('ONLINE')}else if(voiceMode&&!busy&&!isSpeaking)setTimeout(startListening,700)};rec.onend=()=>{if(voiceMode&&!busy&&!isSpeaking)setTimeout(startListening,500)}}function startListening(){if(!rec||busy||isSpeaking)return;try{rec.start()}catch(e){}}function stopListening(){if(rec)try{rec.stop()}catch(e){}}mic.onclick=e=>{e.stopPropagation();showControls();if(!rec){drawer.classList.add('open');add('Browser ini belum mendukung pengenalan suara.','bot');return}voiceMode=true;voiceBtn.textContent='🔊';startListening()};voiceBtn.onclick=e=>{e.stopPropagation();voiceMode=!voiceMode;showControls();if(voiceMode){voiceBtn.textContent='🔊';startListening()}else{voiceBtn.textContent='⚙️';stopListening();speechSynthesis?.cancel();setStatus('ONLINE')}};function updateClock(){const d=new Date();clock.innerHTML=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+'<small>'+d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})+'</small>'}updateClock();setInterval(updateClock,30000);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');showControls();
</script></body></html>
